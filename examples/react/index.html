<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mejiro React example</title>
    <style>
      /*
        MejiroReader fills its container, so the root chain must have an
        explicit height. This is the single most common setup gotcha.
      */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
