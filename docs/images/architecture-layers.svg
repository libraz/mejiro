<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">The layers, and what each one owns</title>
  <desc id="dsc">The application, through the React or Vue package or plain DOM code, enters at the top. On the left is the stack: book and epub side by side, both over render, which sits over browser, which sits over the dependency-free core; arrows point from each layer to the one it uses. On the right, separated by a dashed seam, stand image, which prepares images for EPUB embedding, and analysis, the optional suzume-backed TextAnalyzer that a book receives through BookOptions.analyzer.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .lnd   { fill:none; stroke:#8a6a1f; stroke-width:1.4; stroke-dasharray:5 4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .hb    { font-size:12.5px; font-weight:600 }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .lnd{stroke:#d9b45c} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="408" rx="12"/>

  <rect class="grp" x="24" y="24" width="912" height="40" rx="8"/>
  <text class="lbl" x="38" y="48">application</text>
  <rect class="chip" x="170" y="32" width="132" height="24" rx="5"/>
  <text class="s" x="236.0" y="48" text-anchor="middle">@libraz/mejiro-react</text>
  <rect class="chip" x="310" y="32" width="122" height="24" rx="5"/>
  <text class="s" x="371.0" y="48" text-anchor="middle">@libraz/mejiro-vue</text>
  <rect class="chip" x="440" y="32" width="104" height="24" rx="5"/>
  <text class="s" x="492.0" y="48" text-anchor="middle">vanilla DOM</text>
  <text class="s" x="922" y="48" text-anchor="end">enter at book or epub, or lower</text>

  <rect class="card" x="24" y="88" width="262" height="64" rx="6"/>
  <text class="hb" x="36" y="108">Book</text>
  <text class="mono" x="274" y="108" text-anchor="end">@libraz/mejiro/book</text>
  <text class="s" x="36" y="126">MejiroBook → ChapterLayout → spreads</text>
  <text class="s" x="36" y="140">measure, break, paginate, exclude</text>

  <rect class="card" x="302" y="88" width="262" height="64" rx="6"/>
  <text class="hb" x="314" y="108">EPUB</text>
  <text class="mono" x="552" y="108" text-anchor="end">@libraz/mejiro/epub</text>
  <text class="s" x="314" y="126">parse, edit and build EPUB 3</text>
  <text class="s" x="314" y="140">jszip, plus a host DOM for XHTML</text>

  <rect class="card" x="24" y="176" width="540" height="46" rx="6"/>
  <text class="hb" x="36" y="196">Render</text>
  <text class="mono" x="552" y="196" text-anchor="end">@libraz/mejiro/render</text>
  <text class="s" x="36" y="214">layout results → framework-agnostic RenderPage data, plus the shipped stylesheets</text>

  <rect class="card" x="24" y="246" width="540" height="46" rx="6"/>
  <text class="hb" x="36" y="266">Browser</text>
  <text class="mono" x="552" y="266" text-anchor="end">@libraz/mejiro/browser</text>
  <text class="s" x="36" y="284">fonts via the FontFace API, advances via Canvas.measureText, ruby font size</text>

  <rect class="card" x="24" y="316" width="540" height="46" rx="6"/>
  <text class="hb" x="36" y="336">Core</text>
  <text class="mono" x="552" y="336" text-anchor="end">@libraz/mejiro</text>
  <text class="s" x="36" y="354">line breaking, kinsoku, hanging, ruby, exclusion, pagination — no dependencies, no DOM</text>

  <path class="ln" d="M 155 64 V 86" marker-end="url(#a)"/>
  <path class="ln" d="M 433 64 V 86" marker-end="url(#a)"/>
  <path class="ln" d="M 155 152 V 174" marker-end="url(#a)"/>
  <path class="ln" d="M 433 152 V 174" marker-end="url(#a)"/>
  <path class="ln" d="M 294 222 V 244" marker-end="url(#a)"/>
  <path class="ln" d="M 294 292 V 314" marker-end="url(#a)"/>

  <path class="seam" d="M 576 88 V 362"/>

  <rect class="alt" x="588" y="88" width="316" height="98" rx="6"/>
  <text class="hb" x="600" y="108">Image</text>
  <text class="mono" x="892" y="108" text-anchor="end">@libraz/mejiro/image</text>
  <text class="s" x="600" y="128">prepareImage() downscales and re-encodes</text>
  <text class="s" x="600" y="143">an image for embedding in an EPUB</text>
  <text class="s" x="600" y="158">imports nothing from the stack</text>

  <rect class="alt" x="588" y="250" width="316" height="112" rx="6"/>
  <text class="hb" x="600" y="270">Analysis</text>
  <text class="mono" x="892" y="270" text-anchor="end">@libraz/mejiro/analysis</text>
  <text class="s" x="600" y="290">createSuzumeAnalyzer() builds a TextAnalyzer</text>
  <text class="s" x="600" y="305">over the optional peer @libraz/suzume</text>
  <text class="s" x="600" y="320">handed to a book as BookOptions.analyzer,</text>
  <text class="s" x="600" y="335">consulted only when wordAwareBreaking asks</text>

  <path class="ln2" d="M 746 64 V 86" marker-end="url(#b)"/>
  <path class="ln2" d="M 924 64 V 306 H 906" marker-end="url(#b)"/>

  <text class="s" x="480" y="390" text-anchor="middle">Dependencies only point down: book and epub never import each other, and image and analysis stand outside the stack.</text>
</svg>
