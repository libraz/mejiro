<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mejiro — React Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: system-ui, sans-serif; }
    #root, .demo-shell { height: 100%; }
    .demo-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      background: #1c1915;
    }
    .demo-preview {
      min-width: 0;
      min-height: 0;
    }
    /* Theme overrides — the rest comes from @libraz/mejiro/render/mejiro-reader.css */
    .mejiro-reader {
      --mejiro-font-ui: 'Zen Kaku Gothic New', 'Helvetica Neue', sans-serif;
      --mejiro-font-body: 'Shippori Mincho', 'Noto Serif JP', serif;
      min-width: 0;
    }
    .demo-preview > .mejiro-reader,
    .demo-preview > .mejiro-reader-drop-zone {
      height: 100%;
    }
    .demo-options {
      height: 100%;
      min-width: 0;
      padding: 18px;
      box-sizing: border-box;
      background: #f5f0e4;
      border-left: 1px solid rgba(42, 37, 33, 0.18);
      color: #2a2521;
      font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
      overflow: auto;
    }
    .demo-tabs {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 16px;
      padding: 4px;
      background: #eee6d7;
      border: 1px solid rgba(42, 37, 33, 0.14);
    }
    .demo-tabs button,
    .demo-form button,
    .mejiro-editor-section button,
    .mejiro-editor-export {
      border: 1px solid #ccc5b8;
      background: #fff;
      color: #3f3933;
      font: inherit;
      font-size: 0.76rem;
      cursor: pointer;
    }
    .demo-tabs button {
      min-width: 0;
      padding: 8px 4px;
      border: 0;
      background: transparent;
    }
    .demo-tabs button.is-active {
      background: #8b3a3a;
      color: #fff;
    }
    .demo-section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .demo-section-title small,
    .demo-options-head small {
      color: #7c7166;
      font-size: 0.72rem;
      line-height: 1.4;
    }
    .demo-options-head {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px;
    }
    .demo-options-head span,
    .demo-option-label {
      color: #8b3a3a;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .demo-options-head strong {
      font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
      font-size: 1rem;
      line-height: 1.3;
    }
    .demo-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }
    .demo-toggle-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .demo-toggle input { accent-color: #8b3a3a; }
    .demo-toggle.is-disabled {
      color: #a89e91;
      cursor: not-allowed;
    }
    .demo-toggle.is-disabled input {
      cursor: not-allowed;
    }
    .demo-option-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }
    .demo-segments {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid #ccc5b8;
    }
    .demo-segments-wrap {
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
    }
    .demo-segments button {
      min-width: 0;
      padding: 7px 6px;
      border: 0;
      border-right: 1px solid #ccc5b8;
      background: #fff;
      color: #6b6156;
      font: inherit;
      font-size: 0.68rem;
      cursor: pointer;
    }
    .demo-segments button:last-child { border-right: 0; }
    .demo-segments button.is-active {
      background: #8b3a3a;
      color: #fff;
    }
    .demo-segments button:disabled {
      background: #eee8dc;
      color: #b3aa9d;
      cursor: not-allowed;
    }
    .demo-segments button.is-active:disabled {
      background: #c9b9aa;
      color: #fff;
    }
    .demo-options pre {
      margin: 14px 0 0;
      padding: 10px;
      overflow: auto;
      background: rgba(42, 37, 33, 0.08);
      color: #4f4740;
      font-size: 0.68rem;
      line-height: 1.45;
    }
    .demo-form {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .demo-form label {
      display: grid;
      gap: 5px;
      font-size: 0.72rem;
      color: #6b6156;
    }
    .demo-form input,
    .demo-form textarea,
    .mejiro-editor-section input,
    .demo-select,
    .demo-search {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #ccc5b8;
      background: #fffdf8;
      color: #2a2521;
      font: inherit;
      font-size: 0.78rem;
      padding: 8px;
    }
    .demo-select,
    .demo-search {
      margin-bottom: 8px;
    }
    .demo-form textarea {
      min-height: 132px;
      resize: vertical;
      line-height: 1.65;
    }
    .demo-form textarea.demo-manuscript {
      min-height: 220px;
    }
    .demo-sync-note {
      color: #7c7166;
      font-size: 0.7rem;
      line-height: 1.5;
    }
    .demo-ruby-target {
      margin: 8px 0;
      padding: 8px;
      min-height: 18px;
      border: 1px solid #ddd4c6;
      background: #fffdf8;
      color: #4f4740;
      font-size: 0.76rem;
      line-height: 1.5;
    }
    .demo-empty,
    .demo-error {
      margin: 18px;
      padding: 12px;
      background: #f5f0e4;
      color: #2a2521;
      font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
      font-size: 0.82rem;
    }
    .demo-error {
      border-left: 3px solid #8b3a3a;
    }
    .demo-action-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .demo-action-row button,
    .mejiro-editor-primary,
    .mejiro-editor-export {
      min-height: 34px;
      padding: 8px 10px;
    }
    .demo-list {
      max-height: 190px;
      padding-right: 2px;
      overflow: auto;
    }
    .demo-list-compact {
      max-height: 240px;
    }
    .mejiro-editor-section {
      margin-bottom: 14px;
    }
    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .demo-shell {
        min-height: 100%;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(640px, 100vh) auto;
      }
      .demo-options {
        height: auto;
        border-left: 0;
        border-top: 1px solid rgba(42, 37, 33, 0.18);
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
