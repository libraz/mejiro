<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mejiro — EPUB Vertical Text Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    html, body, .mejiro-reader { height: 100%; }
    body { margin: 0; }
    .mejiro-reader {
      --mejiro-font-ui: "Zen Kaku Gothic New", "Helvetica Neue", sans-serif;
      --mejiro-font-body: "Shippori Mincho", "Noto Serif JP", serif;
      position: relative;
      box-sizing: border-box;
      padding-right: 340px;
    }
    .demo-options {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 220;
      width: 340px;
      padding: 18px;
      box-sizing: border-box;
      background: #f5f0e4;
      border-left: 1px solid rgba(42, 37, 33, 0.18);
      color: #2a2521;
      font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
      overflow: auto;
    }
    .demo-options-head {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px;
    }
    .demo-options-head span,
    .demo-option-label {
      color: #8b3a3a;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .demo-options-head strong {
      font-family: "Shippori Mincho", "Noto Serif JP", serif;
      font-size: 1rem;
      line-height: 1.3;
    }
    .demo-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
    }
    .demo-toggle-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .demo-toggle input { accent-color: #8b3a3a; }
    .demo-toggle.is-disabled {
      color: #a89e91;
      cursor: not-allowed;
    }
    .demo-toggle.is-disabled input {
      cursor: not-allowed;
    }
    .demo-option-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .demo-segments {
      display: grid;
      /* Auto columns keep every option the same width whatever its label says. */
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      border: 1px solid #ccc5b8;
    }
    .demo-segments button {
      min-width: 0;
      padding: 7px 6px;
      border: 0;
      border-right: 1px solid #ccc5b8;
      background: #fff;
      color: #6b6156;
      font: inherit;
      font-size: 0.68rem;
      cursor: pointer;
    }
    .demo-segments button:last-child { border-right: 0; }
    .demo-segments button.is-active {
      background: #8b3a3a;
      color: #fff;
    }
    .demo-segments button:disabled {
      background: #eee8dc;
      color: #b3aa9d;
      cursor: not-allowed;
    }
    .demo-segments button.is-active:disabled {
      background: #c9b9aa;
      color: #fff;
    }
    .demo-options-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(42, 37, 33, 0.18);
    }
    .demo-option-note {
      /* Two lines are always reserved so switching modes never resizes the panel. */
      min-height: 2.6em;
      color: #6b6156;
      font-size: 0.66rem;
      line-height: 1.3;
    }
    .demo-option-note.is-error { color: #8b3a3a; }
    .demo-options pre {
      margin: 14px 0 0;
      padding: 10px;
      overflow: auto;
      background: rgba(42, 37, 33, 0.08);
      color: #4f4740;
      font-size: 0.68rem;
      line-height: 1.45;
    }
    @media (max-width: 900px) {
      html, body, .mejiro-reader {
        height: auto;
        min-height: 100%;
      }
      .mejiro-reader {
        padding-right: 0;
        padding-bottom: 0;
      }
      .demo-options {
        position: static;
        width: auto;
        border-left: 0;
        border-top: 1px solid rgba(42, 37, 33, 0.18);
      }
      .mejiro-reader-body {
        min-height: 640px;
      }
    }
  </style>
</head>
<body>
  <div class="mejiro-reader">
  <header class="mejiro-reader-header" id="readerHeader">
    <div class="mejiro-reader-header-left">
      <div class="mejiro-reader-logo">
        <span class="mejiro-reader-logo-mark">mejiro</span>
        <span class="mejiro-reader-logo-sub">Vertical Reader</span>
      </div>
      <div class="mejiro-reader-chapter-nav" id="chapterNav" hidden>
        <select id="chapterSelect"></select>
      </div>
    </div>
    <div class="mejiro-reader-header-actions">
      <div class="mejiro-reader-stats" id="stats"></div>
      <button type="button" class="mejiro-reader-btn" id="openFile">Open</button>
      <button type="button" class="mejiro-reader-btn" id="imageToggle">Image</button>
      <button type="button" class="mejiro-reader-btn" id="settingsToggle">
        Settings<span class="mejiro-reader-btn-arrow">&#9662;</span>
      </button>
    </div>
  </header>

  <div class="mejiro-reader-settings-panel" id="settingsPanel">
    <div class="mejiro-reader-settings-inner">
      <div class="mejiro-reader-settings-group">
        <span class="mejiro-reader-settings-group-title">Font</span>
        <div class="mejiro-reader-control">
          <select id="fontFamily">
            <option value="'Shippori Mincho', serif">Shippori Mincho</option>
            <option value="'Noto Serif JP', serif">Noto Serif JP</option>
            <option value="'Zen Kaku Gothic New', sans-serif">Zen Kaku Gothic New</option>
            <option value="serif">System Serif</option>
          </select>
        </div>
        <div class="mejiro-reader-control">
          <label class="mejiro-reader-control-label" for="fontSize">Size</label>
          <input type="number" id="fontSize" value="16" min="10" max="48" />
        </div>
      </div>

      <div class="mejiro-reader-settings-group">
        <span class="mejiro-reader-settings-group-title">Layout</span>
        <div class="mejiro-reader-control">
          <label class="mejiro-reader-control-label" for="mode">Kinsoku</label>
          <select id="mode">
            <option value="strict">Strict</option>
            <option value="loose">Loose</option>
          </select>
        </div>
        <div class="mejiro-reader-control">
          <label class="mejiro-reader-control-label" for="hanging">Hanging</label>
          <select id="hanging">
            <option value="true">On</option>
            <option value="false">Off</option>
          </select>
        </div>
        <div class="mejiro-reader-control">
          <label class="mejiro-reader-control-label" for="lineSpacing">行間</label>
          <input type="number" id="lineSpacing" value="1.9" min="1.0" max="3.0" step="0.1" />
        </div>
        <div class="mejiro-reader-control">
          <label class="mejiro-reader-control-label" for="pageNumbers">Page numbers</label>
          <select id="pageNumbers">
            <option value="both">Both</option>
            <option value="right">Right only</option>
            <option value="left">Left only</option>
            <option value="none">None</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="mejiro-reader-body" id="readerBody">
  <nav class="mejiro-reader-chapter-panel" id="chapterPanel" aria-label="Chapters" hidden></nav>
  <div class="mejiro-reader-surface">
    <div class="mejiro-reader-drop-zone" id="dropZone">
      <div class="mejiro-reader-drop-zone-icon">&#x1F4D6;</div>
      <div class="mejiro-reader-drop-zone-text">
        <strong>Drop an EPUB file here</strong><br>
        or click to browse
      </div>
      <div class="mejiro-reader-drop-zone-hint">Supports EPUB with furigana / ruby</div>
    </div>

    <div class="mejiro-reader-loading" id="loading" hidden>Loading...</div>

    <div class="mejiro-reader-book" id="book" hidden>
      <div class="mejiro-reader-spread" id="spread">
        <!-- Right page = earlier content (vertical-rl reads right-to-left) -->
        <div class="mejiro-reader-page mejiro-reader-page--right" id="pageRight">
          <div class="mejiro-reader-page-rule"></div>
          <div class="mejiro-reader-page-header">
            <span class="mejiro-reader-page-header-title" id="runningTitleRight"></span>
            <span class="mejiro-reader-page-header-num" id="runningPageRight"></span>
          </div>
          <div class="mejiro-reader-page-viewport">
            <div class="mejiro-reader-page-clip">
              <div class="mejiro-reader-page-content" id="pageContentRight"></div>
            </div>
          </div>
          <!-- Image overlays are created dynamically by JS -->
        </div>
        <!-- Left page = later content -->
        <div class="mejiro-reader-page mejiro-reader-page--left" id="pageLeft">
          <div class="mejiro-reader-page-rule"></div>
          <div class="mejiro-reader-page-header">
            <span class="mejiro-reader-page-header-title" id="runningTitleLeft"></span>
            <span class="mejiro-reader-page-header-num" id="runningPageLeft"></span>
          </div>
          <div class="mejiro-reader-page-viewport">
            <div class="mejiro-reader-page-clip">
              <div class="mejiro-reader-page-content" id="pageContentLeft"></div>
            </div>
          </div>
        </div>
        <div class="mejiro-reader-nav-zone mejiro-reader-nav-zone--prev" id="navPrev"></div>
        <div class="mejiro-reader-nav-zone mejiro-reader-nav-zone--next" id="navNext"></div>
        <div class="mejiro-reader-page-indicator" id="pageIndicator"></div>
      </div>
    </div>
  </div>
  </div>

    <aside class="demo-options" aria-label="Demo options">
      <div class="demo-options-head">
        <span>Reader props</span>
        <strong>Built-in chrome</strong>
      </div>
      <div class="demo-toggle-grid">
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enableHeader" checked />
          <span>enableHeader</span>
        </label>
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enableDropZone" checked />
          <span>enableDropZone</span>
        </label>
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enableChapterNav" checked />
          <span>enableChapterNav</span>
        </label>
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enableSettings" checked />
          <span>enableSettings</span>
        </label>
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enableImageOverlay" checked />
          <span>enableImageOverlay</span>
        </label>
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enableStats" checked />
          <span>enableStats</span>
        </label>
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enableKeyboard" checked />
          <span>enableKeyboard</span>
        </label>
        <label class="demo-toggle">
          <input type="checkbox" data-reader-option="enablePageIndicator" checked />
          <span>enablePageIndicator</span>
        </label>
      </div>
      <div class="demo-option-group">
        <span class="demo-option-label">chapterNavMode</span>
        <div class="demo-segments" id="chapterNavModeControls">
          <button type="button" data-mode="select">select</button>
          <button type="button" data-mode="panel" class="is-active">panel</button>
          <button type="button" data-mode="both">both</button>
          <button type="button" data-mode="none">none</button>
        </div>
      </div>
      <pre id="readerOptionsCode"></pre>

      <div class="demo-options-section">
        <div class="demo-options-head">
          <span>MejiroBook</span>
          <strong>Analysis-driven breaking</strong>
        </div>
        <div class="demo-option-group">
          <span class="demo-option-label">wordAwareBreaking</span>
          <div class="demo-segments" id="wordAwareControls">
            <button type="button" data-word-aware="off" class="is-active">off</button>
            <button type="button" data-word-aware="clusters">clusters</button>
            <button type="button" data-word-aware="full">full</button>
          </div>
          <span class="demo-option-note" id="wordAwareNote" role="status"></span>
        </div>
      </div>
    </aside>

    <input type="file" id="fileInput" accept=".epub" hidden />
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
